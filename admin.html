<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-4xl mx-auto">
<h1 class="text-3xl font-bold mb-4">📋 Commandes reçues</h1>
<div class="bg-white rounded-xl shadow overflow-x-auto">
<table class="w-full text-sm">
<thead class="bg-gray-800 text-white">
<tr><th class="p-3 text-left">ID</th><th class="p-3 text-left">Nom</th><th class="p-3 text-left">Produit</th><th class="p-3 text-left">Qté</th><th class="p-3 text-left">Date</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
<button onclick="load()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">🔄 Actualiser</button>
</div>
<script>
async function load(){
const data = await fetch("/api/commandes").then(r=>r.json());
document.getElementById("tbody").innerHTML = data.map(c=>`<tr class="border-t hover:bg-gray-50"><td class="p-3">${c.id}</td><td class="p-3 font-medium">${c.nom}</td><td class="p-3">${c.produit}</td><td class="p-3">${c.quantite}</td><td class="p-3 text-gray-500">${new Date(c.date).toLocaleString('fr-FR')}</td></tr>`).join("");
}
load();
setInterval(load,5000);
</script>
</body>
</html>
