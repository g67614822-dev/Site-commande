<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commander</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">🛒 Nouvelle commande</h1>
    <form id="form" class="space-y-4">
      <input name="nom" placeholder="Ton nom" required 
        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <input name="produit" placeholder="Produit" required 
        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <input name="quantite" type="number" min="1" placeholder="Quantité" required 
        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <button class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
        Envoyer la commande
      </button>
    </form>
    <p id="msg" class="mt-4 text-green-600 hidden">Commande envoyée !</p>
  </div>

  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      await fetch("/api/commande", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      document.getElementById("msg").classList.remove("hidden");
      e.target.reset();
      setTimeout(() => document.getElementById("msg").classList.add("hidden"), 3000);
    };
  </script>
</body>
</html>
