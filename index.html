<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
<h1 class="text-2xl font-bold mb-4">🛒 Nouvelle commande</h1>
<form id="form" class="space-y-3">
<input name="nom" placeholder="Nom" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
<input name="produit" placeholder="Produit" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
<input name="quantite" type="number" min="1" placeholder="Quantité" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
<button class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700">Envoyer</button>
</form>
<p id="ok" class="text-green-600 mt-3 hidden">Commande envoyée !</p>
</div>
<script>
document.getElementById("form").onsubmit = async e => {
e.preventDefault();
await fetch("/api/commande", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
document.getElementById("ok").classList.remove("hidden");
e.target.reset();
setTimeout(()=>document.getElementById("ok").classList.add("hidden"),2000);
}
</script>
</body>
  </html>
